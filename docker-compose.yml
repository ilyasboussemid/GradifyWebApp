services:
  fuseki:
    image: stain/jena-fuseki
    container_name: lod-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin123
      - FUSEKI_DATASET_1=lod
    volumes:
      - ./data/ttl:/staging
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
