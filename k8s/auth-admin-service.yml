apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-admin-service
  namespace: gradify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-admin-service
  template:
    metadata:
      labels:
        app: auth-admin-service
    spec:
      containers:
        - name: auth-admin-service
          image: gradify/auth-admin-service:latest
          imagePullPolicy: Never
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: SPARQL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: SPARQL_ENDPOINT
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-admin-service
  namespace: gradify
spec:
  selector:
    app: auth-admin-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
