apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: gradify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
        - name: matching-service
          image: gradify/matching-service:latest
          imagePullPolicy: Never
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SPARQL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: SPARQL_ENDPOINT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: gradify
spec:
  selector:
    app: matching-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
