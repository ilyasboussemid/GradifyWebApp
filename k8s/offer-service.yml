apiVersion: apps/v1
kind: Deployment
metadata:
  name: offer-service
  namespace: gradify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offer-service
  template:
    metadata:
      labels:
        app: offer-service
    spec:
      containers:
        - name: offer-service
          image: gradify/offer-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPARQL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: SPARQL_ENDPOINT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: offer-service
  namespace: gradify
spec:
  selector:
    app: offer-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
