apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: gradify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
        - name: student-service
          image: gradify/student-service:latest
          imagePullPolicy: Never
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPARQL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: SPARQL_ENDPOINT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: gradify
spec:
  selector:
    app: student-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
