apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gradify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gradify/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: gradify-config
                  key: JWT_SECRET
            - name: AUTH_SERVICE_HOST
              value: "auth-admin-service"
            - name: OFFER_SERVICE_HOST
              value: "offer-service"
            - name: STUDENT_SERVICE_HOST
              value: "student-service"
            - name: MATCHING_SERVICE_HOST
              value: "matching-service"
            - name: SPARQL_SERVICE_HOST
              value: "sparql-explorer-service"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: gradify
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
  type: NodePort
