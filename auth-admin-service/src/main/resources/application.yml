server:
  port: 8085

spring:
  application:
    name: auth-admin-service

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:gradify-secret-key-change-in-production-2024}
  expiration: 86400000  # 24 heures

# Admin credentials (configurables via env)
auth:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
